buildscript {
    repositories {
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle' version '[6.0.18,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

import net.minecraftforge.gradle.common.tasks.SignJar

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion =
        JavaLanguageVersion.of(17)

/*
 * Enables dependency embedding. The jarJar task creates the
 * distributable JAR containing MixinExtras.
 */
jarJar.enable()

/*
 * Ensure the Jar-in-Jar output is reobfuscated for use outside
 * the development environment.
 */
reobf {
    jarJar {
    }
}

minecraft {
    mappings channel: mapping_channel, version: mc_version

    copyIdeResources = true

    accessTransformer = file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        configureEach {
            workingDirectory project.file('run')

            property(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            property(
                    'forge.logging.console.level',
                    'debug'
            )

            property(
                    'forge.enabledGameTestNamespaces',
                    mod_id
            )

            property(
                    'mixin.env.remapRefMap',
                    'true'
            )

            property(
                    'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
            )

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property(
                    'forge.enabledGameTestNamespaces',
                    mod_id
            )
        }

        server {
            property(
                    'forge.enabledGameTestNamespaces',
                    mod_id
            )

            args '--nogui'
        }

        gameTestServer {
            property(
                    'forge.enabledGameTestNamespaces',
                    mod_id
            )
        }

        data {
            workingDirectory project.file('run-data')

            args(
                    '--mod',
                    mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/')
            )
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

/*
 * Generates the refmap required to translate mixin targets from
 * development mappings to production mappings.
 */
mixin {
    add(
            sourceSets.main,
            'weaponsexpanded.refmap.json'
    )

    config 'weaponsexpanded.mixins.json'
}

repositories {
    mavenCentral()

    flatDir {
        dir 'libs'
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    minecraft(
            "net.neoforged:forge:"
                    + "${mc_version}-${neo_version}"
    )

    /*
     * Generates the mixin refmap during compilation.
     */
    annotationProcessor(
            'org.spongepowered:mixin:0.8.5:processor'
    )

    /*
     * MixinExtras annotations and compile-time support.
     */
    compileOnly(
            annotationProcessor(
                    "io.github.llamalad7:"
                            + "mixinextras-common:0.5.4"
            )
    )

    /*
     * Embeds MixinExtras into the release JAR. Players do not
     * need to install MixinExtras separately.
     */
    implementation(
            jarJar(
                    "io.github.llamalad7:"
                            + "mixinextras-forge:0.5.4"
            )
    ) {
        jarJar.ranged(
                it,
                "[0.5.4,)"
        )
    }

    compileOnly(
            fg.deobf(
                    "mezz.jei:"
                            + "jei-${mc_version}-common-api:"
                            + "${jei_version}"
            )
    )

    compileOnly(
            fg.deobf(
                    "mezz.jei:"
                            + "jei-${mc_version}-forge-api:"
                            + "${jei_version}"
            )
    )

    runtimeOnly(
            fg.deobf(
                    "mezz.jei:"
                            + "jei-${mc_version}-forge:"
                            + "${jei_version}"
            )
    )
}

tasks.named(
        'processResources',
        ProcessResources
).configure {
    var replaceProperties = [
            mc_version           : mc_version,
            mc_version_range     : mc_version_range,
            neo_version          : neo_version,
            neo_version_range    : neo_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(
            [
                    'META-INF/mods.toml',
                    'pack.mcmeta'
            ]
    ) {
        expand replaceProperties + [
                project: project
        ]
    }
}

/*
 * The ordinary JAR does not include embedded dependencies.
 * Naming it "slim" prevents it from being distributed by mistake.
 */
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    manifest {
        attributes(
                [
                        'Specification-Title':
                                mod_id,
                        'Specification-Vendor':
                                mod_authors,
                        'Specification-Version':
                                '1',
                        'Implementation-Title':
                                project.name,
                        'Implementation-Version':
                                project.jar.archiveVersion,
                        'Implementation-Vendor':
                                mod_authors,
                        'Implementation-Timestamp':
                                new Date().format(
                                        "yyyy-MM-dd'T'HH:mm:ssZ"
                                ),
                        'MixinConfigs':
                                'weaponsexpanded.mixins.json'
                ]
        )
    }

    finalizedBy 'reobfJar'
}

/*
 * The Jar-in-Jar output is the distributable mod. Removing its
 * classifier gives it the normal release filename.
 */
tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''

    finalizedBy 'reobfJarJar'
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}

publishing {
    publications {
        register(
                'mavenJava',
                MavenPublication
        ) {
            /*
             * Publish the complete Jar-in-Jar artifact rather than
             * the slim JAR.
             */
            artifact tasks.named('jarJar')
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def keystore = System.getenv('KEYSTORE')

if (keystore) {
    tasks.register(
            'signJar',
            SignJar
    ) {
        onlyIf {
            keystore != null
        }

        keyStore = keystore
        alias = System.getenv('KEYSTORE_ALIAS')
        storePass = System.getenv('KEYSTORE_PASSWORD')
        keyPass = System.getenv('KEYSTORE_PASSWORD')

        inputFile =
                tasks.named('jarJar').get().archiveFile

        outputFile =
                tasks.named('jarJar').get().archiveFile
    }

    tasks.named('jarJar').configure {
        finalizedBy 'signJar'
    }
}